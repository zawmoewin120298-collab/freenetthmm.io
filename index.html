<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarLink Bypass Config</title>
    <style>
        body { background-color: #000; color: #0f0; text-align: center; padding: 15px; font-family: sans-serif; }
        .container { max-width: 450px; margin: auto; padding: 20px; border: 2px solid #0f0; border-radius: 20px; background: #050505; box-shadow: 0 0 20px rgba(0, 255, 0, 0.4); }
        h1 { font-size: 22px; text-shadow: 0 0 10px #0f0; margin-bottom: 5px; color: #0f0; text-transform: uppercase; }
        .status { color: #888; font-size: 13px; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .config-card { background: #111; border: 1px dashed #0f0; padding: 15px; margin-top: 12px; border-radius: 12px; }
        .label { font-size: 14px; margin-bottom: 10px; color: #fff; font-weight: bold; }
        button { background: #0f0; color: #000; border: none; padding: 12px 20px; font-weight: bold; cursor: pointer; border-radius: 10px; width: 100%; font-size: 14px; transition: 0.3s; text-transform: uppercase; }
        button:hover { background: #0c0; box-shadow: 0 0 10px #0f0; }
        .music-player { margin-top: 25px; padding: 15px; background: #111; border-radius: 12px; border: 1px solid #222; }
        audio { width: 100%; height: 35px; filter: invert(100%) hue-rotate(90deg); }
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #0f0; color: #000; padding: 10px 25px; border-radius: 30px; display: none; font-size: 14px; font-weight: bold; z-index: 100; box-shadow: 0 0 15px #0f0; }
    </style>
</head>
<body>
    <div id="toast">COPIED TO CLIPBOARD!</div>
    <div class="container">
        <h1>SERVER IS RUNNING</h1>
        <div class="status">| Status: Active | StarLink Bypass</div>
        <p style="font-size: 15px; color: #0f0; margin: 10px 0;">ဖိုင်အောက်မှာယူပါ</p>

        <div class="config-card"><div class="label">VLESS CONFIG</div><button onclick="copyConfig('vless-link')">COPY VLESS LINK</button></div>
        <div class="config-card"><div class="label">AIS CONFIG</div><button onclick="copyConfig('ais-link')">COPY AIS LINK</button></div>
        <div class="config-card"><div class="label">TRUE CONFIG</div><button onclick="copyConfig('true-link')">COPY TRUE LINK</button></div>
        <div class="config-card"><div class="label">STARLINK CONFIG</div><button onclick="copyConfig('starlink-link')">COPY STARLINK LINK</button></div>

        <div class="music-player">
            <p style="font-size: 12px; color: #0f0; margin-bottom: 10px;">🎵 Background Music</p>
            <audio id="bgMusic" controls autoplay loop>
                <source src="https://github.com/zawmoewin2025/music/raw/main/K%20Soe%20Lay%20_%20%E1%80%9E%E1%80%AC%E1%80%B8%E1%80%99%E1%80%AD%E1%80%AF%E1%80%80%E1%80%BA%E1%80%94%E1%80%B1%E1%80%AC%E1%80%84%E1%80%BA%E1%80%90%20-%20k%E1%80%85%E1%80%AD%E1%80%AF%E1%80%B8%E1%80%9C%E1%80%B1%E1%80%B8%20_MyanmarSong%20_KSoeLay(MP3_160K).mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

    <textarea id="vless-link" style="display:none;">vless://e79f1f25-51ee-4916-b705-8f82c30cf8fc@support.zoom.us.cloudinternet.de5.net:8080?path=%2F&security=none&encryption=none&host=support.zoom.us.cloudinternet.de5.net&type=ws&sni=support.zoom.us.cloudinternet.de5.net#VLESS-BYPASS</textarea>
    <textarea id="ais-link" style="display:none;">vless://e79f1f25-51ee-4916-b705-8f82c30cf8fc@www.speedtest.net.opentwitter.de5.net:443?path=%2F&security=tls&encryption=none&insecure=0&host=www.speedtest.net.opentwitter.de5.net&type=ws&allowInsecure=0&sni=www.speedtest.net.opentwitter.de5.net#AIS-Path</textarea>
    <textarea id="true-link" style="display:none;">vless://f2e17b4d-22fd-44a4-90db-40649717be8e@portal-as.ruijienetworks.com.speedtestnet.ggff.net:443?path=%2F%3Fed%3D2560&security=tls&encryption=none&insecure=0&host=portal-as.ruijienetworks.com.speedtestnet.ggff.net&fp=random&type=ws&allowInsecure=0&sni=portal-as.ruijienetworks.com.speedtestnet.ggff.net#TRUE-Path</textarea>
    <textarea id="starlink-link" style="display:none;">starlink-config-link-goes-here</textarea>

    <script>
        function copyConfig(elementId) {
            var copyText = document.getElementById(elementId);
            var toast = document.getElementById("toast");
            
            // စာသားကူးယူခြင်း
            navigator.clipboard.writeText(copyText.value).then(() => {
                toast.style.display = "block";
                setTimeout(function(){ toast.style.display = "none"; }, 2000);
            }).catch(err => {
                console.error('Error in copying: ', err);
            });
        }
    </script>
</body>
</html>
